[project]
name = "cs440-final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Gray", email = "davidgraymi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "ray>=2.60",
    "torch>=2.15.0",
]

[project.scripts]
cs440-final-project = "cs440_final_project:main"
trm-train = "cs440_final_project.train:main"
trm-eval = "cs440_final_project.evaluate:main"
c4-data = "cs440_final_project.connect4:main"
c4-train = "cs440_final_project.c4_train:train_main"
c4-eval = "cs440_final_project.c4_train:eval_main"
c4-sweep = "cs440_final_project.c4_train:sweep_main"
c4-build-data = "cs440_final_project.c4data:build_main"
c4-queue = "cs440_final_project.jobqueue:main"
c4-assemble = "cs440_final_project.c4data:assemble_main"
c4-baselines = "cs440_final_project.c4data:baselines_main"
c4-ponder = "cs440_final_project.c4_ponder:train_main"
c4-ponder-eval = "cs440_final_project.c4_ponder:eval_main"
c4-ponder-decide = "cs440_final_project.c4_ponder:decide_main"
c4-outer-loop = "cs440_final_project.outer_loop:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
